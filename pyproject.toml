[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-harness"
version = "0.1.0"
description = "Deterministic Stage-A memory and plan-reuse contracts"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_harness = ["py.typed", "README.md"]
